<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络运维故障诊断 Agent</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
       background:#f5f6f8;display:flex;flex-direction:column;height:100vh}
  header{padding:14px 20px;background:#1f2937;color:#fff}
  header h1{margin:0;font-size:17px;font-weight:600}
  header p{margin:4px 0 0;font-size:12px;color:#9ca3af}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:760px;padding:12px 16px;border-radius:12px;line-height:1.7;
       white-space:pre-wrap;word-break:break-word;font-size:15px}
  .user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:#fff;border:1px solid #e5e7eb;border-bottom-left-radius:4px}
  .status{align-self:flex-start;color:#6b7280;font-size:13px;font-style:italic;padding-left:6px}
  footer{padding:14px 20px;background:#fff;border-top:1px solid #e5e7eb;display:flex;gap:10px}
  #input{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:8px;
         font-size:15px;font-family:inherit;resize:none;height:52px}
  #send{padding:0 22px;background:#2563eb;color:#fff;border:none;border-radius:8px;
        font-size:15px;cursor:pointer}
  #send:disabled{background:#9ca3af;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>网络运维故障诊断 Agent</h1>
  <p>描述故障现象，Agent 会检索知识库并给出排查方案</p>
</header>

<div id="chat"></div>

<footer>
  <textarea id="input" placeholder="例如：交换机接口 Down 怎么排查"></textarea>
  <button id="send">发送</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const btn = document.getElementById("send");

// 每个浏览器一个会话：第一次访问生成随机 ID 存在本地，之后一直复用
let sessionId = localStorage.getItem("session_id");
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem("session_id", sessionId);
}

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addStatus(text) {
  const div = document.createElement("div");
  div.className = "status";
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function ask(question) {
  btn.disabled = true;
  addMsg(question, "user");
  input.value = "";

  let botEl = null;
  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: question, session_id: sessionId})
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});   // stream:true 防止切坏中文

      const parts = buffer.split("\n\n");                // SSE 用空行分隔事件
      buffer = parts.pop();                              // 最后一段可能不完整，留到下一轮

      for (const part of parts) {
        if (!part.startsWith("data: ")) continue;
        const ev = JSON.parse(part.slice(6));

        if (ev.type === "status") {
          addStatus("⏳ " + ev.msg);
        } else if (ev.type === "answer") {
          botEl = addMsg(ev.text, "bot");
        } else if (ev.type === "error") {
          addMsg("出错了：" + ev.msg, "bot");
        }
      }
    }
  } catch (e) {
    addMsg("请求失败：" + e.message, "bot");
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

btn.onclick = () => { const q = input.value.trim(); if (q) ask(q); };
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); btn.click(); }
});
</script>
</body>
</html>
